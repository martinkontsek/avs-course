/interface bridge
add name=lo0
add name=lo1

/interface ethernet
set ether1 mtu=1400

/ip address
add address=192.168.1.3/24 interface=ether1 network=192.168.1.0
add address=1.1.1.1 interface=lo0 network=1.1.1.1
add address=2.3.4.1/24 interface=lo1 network=2.3.4.0

/routing rip instance
add name=rip redistribute=connected,static update-interval=5

/routing rip interface-template
add instance=rip interfaces=all

/system logging
add topics=rip action=memory
